version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: vm_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  backend:
    build: ./backend
    container_name: backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_NAME: vm_db
      DB_USER: admin
      DB_PASS: admin
      DB_PORT: 5432
      JWT_SECRET: your-super-secret-jwt-key
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

   frontend:
    build: ./frontend
    container_name: frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "80:80"
    environment:
      NODE_ENV: development
      API_URL: http://backend:3000
    depends_on:
      - backend
    command: npx live-server --port=80 --host=0.0.0.0

volumes:
  pgdata: